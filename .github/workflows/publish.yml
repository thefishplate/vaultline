name: Publish to PyPI

# Fires when a GitHub Release is published, not on every tag push, so that
# creating a tag and deciding to release remain two separate acts.
#
# workflow_dispatch is here for one reason worth recording: a release event
# runs the workflow as it existed *at the commit the release points to*. The
# first release therefore cannot use it, because the tag necessarily predates
# the workflow that publishes it - a bootstrap problem every repo hits once.
# Manual dispatch runs from the chosen branch instead, which has the file.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # No dependencies to install: the suite is standard library only. If
      # that ever stops being true, this step starts failing, which is the
      # point.
      - name: Run the test suite
        run: python vaultline_dev.py

  build:
    name: Build sdist and wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - name: Check the artifacts are well formed
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    # id-token: write is what makes Trusted Publishing work - it lets the job
    # mint a short-lived OIDC token that PyPI verifies against the publisher
    # it has on record. No API token exists, so there is none to store, rotate
    # or leak, and none for a successor to inherit.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
